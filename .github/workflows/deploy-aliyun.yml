name: Deploy Aliyun Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy-aliyun"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      HUGO_VERSION: 0.147.7

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Build site
        working-directory: docs
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --minify --baseURL "${{ secrets.SITE_BASE_URL }}"

      - name: Install ossutil
        run: |
          curl -fL -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-linux-amd64.zip
          unzip ossutil.zip
          sudo mv ossutil-2.1.2-linux-amd64/ossutil /usr/local/bin/ossutil

      - name: Sync to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          ossutil sync docs/public/ oss://${{ secrets.OSS_BUCKET }}/ \
            --endpoint ${{ secrets.OSS_ENDPOINT }} \
            --delete \
            --force

      - name: Install Aliyun CLI
        run: |
          curl -o aliyun.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf aliyun.tgz
          sudo mv aliyun /usr/local/bin/aliyun

      - name: Flush CDN cache
        env:
          ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIBABACLOUD_REGION_ID: ${{ secrets.ALIYUN_REGION }}
        run: |
          aliyun cdn RefreshObjectCaches \
            --access-key-id "$ALIBABACLOUD_ACCESS_KEY_ID" \
            --access-key-secret "$ALIBABACLOUD_ACCESS_KEY_SECRET" \
            --region "$ALIBABACLOUD_REGION_ID" \
            --ObjectPath "${{ secrets.CDN_DOMAIN }}/" \
            --ObjectType Directory

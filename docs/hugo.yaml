# Configuration
baseURL: "https://example.com/"
title: "读写障碍百科"

enableRobotsTXT: true
# Parse Git commit
enableGitInfo: true
# enableEmoji: false
hasCJKLanguage: true

# services:
#   googleAnalytics:
#     ID: G-MEASUREMENT_ID

outputs:
  home: [html, llms]
  page: [html]
  section: [html, rss]

defaultContentLanguage: zh-cn
languages:
  en:
    languageName: English
    weight: 1
    title: Dyslexia Wiki
  # ja:
  #   languageName: 日本語
  #   languageCode: ja-JP
  #   weight: 3
  #   title: Hextra
  #   params:
  #     banner:
  #       message: |
  #         Hextra **v0.11** がリリースされました！🎉 [新着情報はこちら]({{% ref "blog/v0.11" %}})
  zh-cn:
    languageName: 简体中文
    languageCode: zh-CN
    weight: 4
    title: 读写障碍百科
    params:
  zh-tw:
    languageName: 繁体中文
    languageCode: zh-TW
    weight: 5
    title: 读写障碍百科
    params:

module:
  hugoVersion:
    extended: true
    min: "0.146.0"

  workspace: hugo.work
  imports:
    - path: github.com/imfing/hextra

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
        enable: true

enableInlineShortcodes: true

menu:
  main:
    - identifier: documentation
      name: Documentation
      pageRef: /docs
      weight: 1
    - identifier: chinese
      name: 中文读写障碍
      pageRef: /chinese
      weight: 2
    - identifier: english
      name: 英文读写障碍
      pageRef: /english
      weight: 3
    - identifier: blog
      name: Blog
      pageRef: /blog
      weight: 4
    - identifier: about
      name: About
      pageRef: /about
      weight: 5
    - identifier: showcase
      name: Showcase
      pageRef: /showcase
      weight: 6
      params:
        type: link
        icon: collection
    - name: Search
      weight: 7
      params:
        type: search
    - identifier: versions
      name: Versions
      weight: 8
    - name: GitHub
      weight: 9
      url: "https://github.com/imfing/hextra"
      params:
        icon: github
    - identifier: development
      name: Development ↗
      url: https://imfing.github.io/hextra/versions/latest/
      parent: versions
      params:
        type: link
        icon: beaker
    - identifier: v0.10
      name: v0.10 ↗
      url: https://imfing.github.io/hextra/versions/v0.10/
      parent: versions
    - identifier: v0.9
      name: v0.9 ↗
      url: https://imfing.github.io/hextra/versions/v0.9/
      parent: versions

  sidebar:
    - identifier: more
      name: More
      params:
        type: separator
      weight: 1
    - identifier: about
      name: "About"
      pageRef: "/about"
      weight: 2
    - identifier: hugoDocs
      name: "Hugo Docs ↗"
      url: "https://gohugo.io/documentation/"
      weight: 3

params:
  description: Modern, responsive, batteries-included Hugo theme for creating beautiful static websites.

  externalLinkDecoration: true


  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      # width: 40
      # height: 20
      # link: /
    width: wide

  theme:
    # light | dark | system
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
    width: normal

  # Display the last modification date
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  # Search
  # flexsearch is enabled by default
  search:
    enable: true
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      # full | forward | reverse | strict
      # https://github.com/nextapps-de/flexsearch/#tokenizer-prefix-search
      tokenize: forward

  editURL:
    enable: true
    base: "https://github.com/imfing/hextra/edit/main/docs/content"

  blog:
    list:
      displayTags: true
      # date | lastmod | publishDate | title | weight
      sortBy: date
      sortOrder: desc # or "asc"
      # Pagination
      pagerSize: 20

    article:
      displayPagination: true

  toc:
    displayTags: true

  highlight:
    copy:
      enable: true
      # hover | always
      display: hover

  page:
    # full (100%), wide (90rem), normal (80rem)
    width: normal
    # tabs:
    #   sync: true

  comments:
    enable: false
    type: giscus

    # https://giscus.app/
    giscus:
      repo: imfing/hextra
      repoId: R_kgDOJ9fJag
      category: General
      categoryId: DIC_kwDOJ9fJas4CY7gW
      # mapping: pathname
      # strict: 0
      # reactionsEnabled: 1
      # emitMetadata: 0
      # inputPosition: top
      # lang: en
      # theme: noborder_dark

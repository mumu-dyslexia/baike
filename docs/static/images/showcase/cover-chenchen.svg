  <line x1="350" y1="490" x2="332" y2="518" stroke="#be185d" stroke-width="4" stroke-linecap="round"/>
  <line x1="350" y1="490" x2="368" y2="518" stroke="#be185d" stroke-width="4" stroke-linecap="round"/>
  <!-- Child figure smaller -->

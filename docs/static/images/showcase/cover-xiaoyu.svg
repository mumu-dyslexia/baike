<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff"/>
      <stop offset="100%" style="stop-color:#c7d2fe"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="650" cy="100" r="120" fill="#a5b4fc" opacity="0.3"/>
  <circle cx="150" cy="500" r="90" fill="#818cf8" opacity="0.2"/>
  <circle cx="700" cy="480" r="60" fill="#6366f1" opacity="0.15"/>
  <!-- Book shape -->
  <rect x="280" y="180" width="110" height="150" rx="6" fill="#fff" opacity="0.9"/>
  <rect x="400" y="180" width="110" height="150" rx="6" fill="#fff" opacity="0.85"/>
  <rect x="390" y="178" width="22" height="154" fill="#c7d2fe"/>
  <!-- Lines on book -->
  <line x1="298" y1="220" x2="372" y2="220" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
  <line x1="298" y1="240" x2="372" y2="240" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
  <line x1="298" y1="260" x2="355" y2="260" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
  <line x1="418" y1="220" x2="492" y2="220" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
  <line x1="418" y1="240" x2="492" y2="240" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
  <line x1="418" y1="260" x2="475" y2="260" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
  <!-- Child figure -->
  <circle cx="400" cy="400" r="28" fill="#6366f1"/>
  <line x1="400" y1="428" x2="400" y2="480" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
  <line x1="400" y1="445" x2="368" y2="465" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
  <line x1="400" y1="445" x2="432" y2="465" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
  <line x1="400" y1="480" x2="375" y2="510" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
  <line x1="400" y1="480" x2="425" y2="510" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
</svg>
